name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

jobs:
  singbox:
    name: Native Build (sing-box)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: sing-box Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/libs/sing-box.aar
          key: sing-box-v1.12.24
      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Set up JDK 17
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "y" | sdkmanager --install "ndk;21.4.7075529" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
      - name: Build sing-box AAR
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash bin/singbox/build.sh
      - name: Verify AAR exists
        run: |
          if [ ! -f TMessagesProj/libs/sing-box.aar ]; then
            echo "ERROR: sing-box.aar not found!"
            exit 1
          fi
          ls -la TMessagesProj/libs/sing-box.aar
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    needs:
      - singbox
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: sing-box Cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/libs/sing-box.aar
          key: sing-box-v1.12.24
      - name: Verify sing-box AAR exists
        run: |
          if [ ! -f TMessagesProj/libs/sing-box.aar ]; then
            echo "ERROR: sing-box.aar not found! This should have been built by the singbox job."
            exit 1
          fi
          echo "sing-box.aar found: $(ls -la TMessagesProj/libs/sing-box.aar)"
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Generate random signing key
        run: |
          # PKCS12 (the default keystore type on modern JDKs) encrypts each key entry
          # using the store password; Android's signing tools reject a keystore where
          # the key password differs from the store password (causes a
          # "Given final block not properly padded" error), so we reuse one password.
          KEYSTORE_PASS_GEN=$(openssl rand -hex 16)
          ALIAS_PASS_GEN="$KEYSTORE_PASS_GEN"
          ALIAS_NAME_GEN="key$(date +%s)"

          # Remove any pre-existing keystore (e.g. committed to the repo) so keytool
          # creates a brand new one instead of trying to open it with our new password.
          rm -f TMessagesProj/release.keystore

          keytool -genkeypair -v \
            -keystore TMessagesProj/release.keystore \
            -storetype PKCS12 \
            -alias "$ALIAS_NAME_GEN" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS_GEN" \
            -keypass "$ALIAS_PASS_GEN" \
            -dname "CN=NagramXF CI, OU=CI, O=CI, L=Unknown, ST=Unknown, C=US"

          echo "::add-mask::$KEYSTORE_PASS_GEN"
          echo "::add-mask::$ALIAS_PASS_GEN"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS_GEN" >> "$GITHUB_ENV"
          echo "ALIAS_PASS=$ALIAS_PASS_GEN" >> "$GITHUB_ENV"
          echo "ALIAS_NAME=$ALIAS_NAME_GEN" >> "$GITHUB_ENV"
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease

          APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Release
          path: ${{ env.APK }}
  upload:
    name: Upload release
    if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: ${{ github.event.head_commit.id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
        run: |
          # send apk via telegram bot api
          export mini64=$(find artifacts -name "*arm64-v8a.apk")
          echo $mini64
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} release ${{ secrets.HELPER_BOT_CANARY_TARGET }}
